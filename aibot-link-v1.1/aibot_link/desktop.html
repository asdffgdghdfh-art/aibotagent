<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aibot Bridge · 电脑控制台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1c222d;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}.wrap{max-width:1000px;margin:0 auto;padding:38px 22px}.head{display:flex;gap:14px;align-items:center;margin-bottom:35px}.symbol{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#111825;color:#fff;font-size:22px;font-weight:850}.head h1{font-size:24px;line-height:1.1;margin:0}.sub{color:#7b8494;font-size:12px}.pill{margin-left:auto;color:#367957;background:#dff8e9;border-radius:30px;padding:7px 13px;font-size:12px}.hero{background:#161c28;color:#f9fafc;padding:27px;border-radius:20px;margin-bottom:20px}.hero h2{font-size:26px;margin:0 0 6px}.hero p{margin:0;color:#b6bfd0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{background:white;border:1px solid #e1e4ea;border-radius:18px;padding:21px}.card h3{margin:0 0 17px;font-size:17px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f1f3}.row:last-child{border-bottom:0}.tag{border-radius:8px;background:#edf2ff;color:#405bb1;font-weight:600;font-size:12px;padding:5px 9px}.tag.off{background:#f3f3f3;color:#9ca2ae}.events{max-height:330px;overflow:auto;background:#101721;color:#d8e1f5;font:12px/1.7 Consolas,monospace;padding:18px;border-radius:12px;white-space:pre-wrap;word-break:break-word}.muted{color:#7b8494}.count{font-size:26px;font-weight:750}.footer{color:#959ba8;font-size:11px;margin-top:18px;text-align:center}.dot{display:inline-block;width:8px;height:8px;background:#7ddc9e;border-radius:99px;margin-right:7px}@media(max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:22px 14px}.hero h2{font-size:22px}}</style></head>
<body><div class="wrap"><header class="head"><div class="symbol">A</div><div><h1>Aibot Bridge</h1><div class="sub">这台电脑的安全执行节点 · V1.1</div></div><div class="pill"><span class="dot"></span>本机服务已启动</div></header><section class="hero"><h2 id="name">正在连接...</h2><p id="state">电脑 Agent 等待调度</p></section><div class="grid"><div class="card"><h3>本机能力</h3><div class="row"><span>Codex</span><span class="tag" id="codex">检测中</span></div><div class="row"><span>DeepSeek DSH</span><span class="tag off" id="dsh">受限</span></div><div class="row"><span>当前远程任务</span><span class="muted" id="current">无</span></div><div class="row"><span>连接到的 Relay</span><span class="muted" id="server">-</span></div></div><div class="card"><h3>授权项目</h3><div id="projects" class="muted">暂无项目</div><p class="sub">仅在指定工作目录执行任务。手机端不能绕过项目白名单直接操作你的电脑。</p></div><div class="card" style="grid-column:1/-1"><h3>执行日志</h3><div class="events" id="events">等待任务...</div></div></div><p class="footer">Aibot Link · 不存储 Codex 或 DSH 登录密钥 · 重要操作需审批</p></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function refresh(){try{const r=await fetch('/state.json',{cache:'no-store'});const d=await r.json();document.getElementById('name').textContent=d.name;document.getElementById('state').textContent=d.status;document.getElementById('codex').textContent=d.codex?'● 已安装':'未检测到';document.getElementById('codex').className='tag '+(d.codex?'':'off');document.getElementById('dsh').textContent=d.dsh?'● 已启用（需任务审批）':'默认禁用';document.getElementById('dsh').className='tag '+(d.dsh?'':'off');document.getElementById('current').textContent=d.task||'无';document.getElementById('server').textContent=d.server;document.getElementById('projects').innerHTML=d.projects.length?d.projects.map(x=>'<div class="row">📁 '+esc(x)+'</div>').join(''):'暂无项目';document.getElementById('events').textContent=d.events.map(e=>`[${e.at}] ${e.text}`).join('\n')||'等待任务...';}catch(e){document.getElementById('state').textContent='无法读取 Bridge 状态';}}
refresh();setInterval(refresh,3000);
</script></body></html>
