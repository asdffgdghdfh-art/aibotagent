name: Aibot Link Tests
on:
  push:
    branches: [main]
    paths:
      - 'aibot-link-v1.1/**'
      - 'scripts/package_desktop.py'
      - 'scripts/prepare_public_ci_android.py'
      - '.github/workflows/checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Relay, Bridge, pairing and task handoff
        working-directory: aibot-link-v1.1
        run: python -m unittest discover -s tests -v
      - name: Check mobile JavaScript and deployment shell
        run: |
          node --check aibot-link-v1.1/aibot_link/mobile.js
          bash -n aibot-link-v1.1/deploy/install_relay.sh
          python -m py_compile scripts/prepare_public_ci_android.py scripts/package_desktop.py
      - name: Validate Windows and Mac Bridge archives
        run: |
          python scripts/package_desktop.py --target Windows
          python scripts/package_desktop.py --target Mac
